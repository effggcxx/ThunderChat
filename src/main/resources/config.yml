# ThunderChat configuration
# Channel formats support {channel}, {server}, {prefix}, {player}, {message}
# plus any PlaceholderAPI placeholder.
format:
  prefix-placeholder: "%luckperms_prefix% "
  normal: "{prefix}&r{player}&7: &f{message}"
  global: "&7[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
  channels:
    local: "{prefix}&r{player}&7: &f{message}"
    global: "<bold><dark_blue>GLOBAL</dark_blue> <aqua>Chat</aqua> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    staff: "<bold><dark_purple>Staff</dark_purple> <light_purple>Chat</light_purple> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    donator: "<bold><dark_green>Donator</dark_green> <green>Chat</green> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    admin: "<bold><dark_red>Admin</dark_red> <red>Chat</red> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    highrank: "<bold><gold>HighRank</gold> <yellow>Chat</yellow> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
network:
  enabled: true
  server-name: "skymine"
  # Every backend using ThunderChat must be listed here for the MySQL fallback queue.
  servers:
    - "skymine"
    - "bedwars"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  private-messages:
    enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  flood:
    enabled: true
    max-consecutive-characters: 3
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
    enabled: true
    words:
      - "fuck"
      - "fucking"
      - "fucked"
      - "motherfucker"
      - "shit"
      - "bullshit"
      - "bitch"
      - "asshole"
      - "bastard"
      - "dick"
      - "cock"
      - "pussy"
      - "cunt"
      - "whore"
      - "slut"
      - "crap"
      - "piss"
      - "damn"
      - "کص"
      - "کس"
      - "کیر"
      - "کون"
      - "کونده"
      - "جنده"
      - "فاحشه"
      - "حرومزاده"
      - "مادرجنده"
      - "بی شرف"
      - "بی‌شرف"
      - "بی ناموس"
      - "بی‌ناموس"
      - "گه"
      - "گوه"
      - "عن"
      - "لاشی"
      - "عوضی"
      - "الدنگ"
      - "پفیوز"
  advertisement:
    enabled: true
    block-ip: true
    block-domains: true
    server-names:
      - "MadCraft"
      - "TrexMine"
      - "GameUP"
      - "GunMax"
      - "EternullMC"
      - "NoxelSMP"
      - "BighanoonAbad"
      - "XCraft"
      - "MythoriaSMP"
      - "BitCraft"
      - "ColdGames"
      - "LunaMC"
      - "InfernoGaming"
      - "UCraft"
      - "PeakCraft"
      - "LexoGame"
      - "IceCreamSky"
      - "NeoCraft"
      - "PolluxMC"
      - "UKGame"
      - "EmoCrafts"
      - "MineHub"
      - "MineHeaven"
      - "AtlasCraft"
      - "LightMc"
      - "GameLandMC"
      - "SkyDenMc"
      - "ModernShadow"
      - "AetherMC"
      - "NullMC"
alerts:
  enabled: true
  broadcast-network: true
  types:
    spam: true
    flood: true
    caps: true
    swear: true
    advertisement: true
  format: "&c&l[ALERT]&r &c{type}&r &8| &7{server}&r &8| &f{player}&r &8| &7{message}"
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"
ignore:
  public-chat:
    enabled: false
spy:
  enabled: true
  autoenable: true
  private-message-format: "&8[&7SPY&r&8] &7{player}&r &8---> &7{target}&r &8: &7{message}"
  command-format: "&8[&7SPY&r&8] &7{player}&r &8: &7{message}"
  anvil-format: "&8[&7SPY&r&8] &7{player}&r &8renamed an item to: &f{message}"
  sign-format: "&8[&7SPY&r&8] &7{player}&r &8wrote on a sign: &f{message}"
  book-format: "&8[&7SPY&r&8] &7{player}&r &8wrote in a book: &f{message}"
storage:
  type: mysql
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "thunderchat"
    username: "root"
    password: "change-me"
    pool-size: 4
    # Persistent state is cached in memory and written asynchronously in batches.
    # Legacy YAML files are imported when a MySQL record is absent.
lists:
  staff:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no staff &donline&7."
  highrank:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no highrank &donline&7."
  admin:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no admin &donline&7."
  donator:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no donator &donline&7."
interactive:
  enabled: true
  max-placeholders: 12
  universal-cooldown: 0
  item:
    enabled: true
    click-enabled: true
    cooldown: 0
  inventory:
    enabled: true
    cooldown: 0
  ender:
    enabled: true
    cooldown: 0
  player:
    enabled: true
    case-sensitive: true
    hover-enabled: true
    click-enabled: true
  commands:
    enabled: true
    format: "<aqua>[<yellow>{command}</yellow>]</aqua>"
    hover: "<yellow>Click to suggest <white>{command}</white>.</yellow>"
  position:
    enabled: true
  ping:
    enabled: true
  custom-placeholders:
    server:
      keyword: "(?i)\\[server\\]"
      replace: "<aqua>%server_name%</aqua>"
      cooldown: 0
    world:
      keyword: "(?i)\\[world\\]"
      replace: "<green>%player_world%</green>"
      cooldown: 0
    time:
      keyword: "(?i)\\[time\\]"
      replace: "<yellow>%server_time_HH:mm:ss%</yellow>"
      cooldown: 0
    pos:
      keyword: "(?i)\\[position\\]"
      replace: "<aqua>%player_world%</aqua> <white>%player_x%</white>, <white>%player_y%</white>, <white>%player_z%</white>"
      cooldown: 0
