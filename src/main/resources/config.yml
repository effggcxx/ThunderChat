# ThunderChat configuration
# Channel formats support {channel}, {server}, {prefix}, {player}, {message}
# plus any PlaceholderAPI placeholder.
format:
  prefix-placeholder: "%luckperms_prefix% "
  normal: "{prefix}&r{player}&7: &f{message}"
  global: "&7[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
  channels:
    local: "{prefix}&r{player}&7: &f{message}"
    global: "&7[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    staff: "&c[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    donator: "&6[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    admin: "&4[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    highrank: "&b[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
network:
  enabled: true
  server-name: "skymine"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  private-messages:
    enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  flood:
    enabled: true
    max-consecutive-characters: 3
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
    enabled: true
    words:
      - "fuck"
      - "fucking"
      - "fucked"
      - "motherfucker"
      - "shit"
      - "bullshit"
      - "bitch"
      - "asshole"
      - "bastard"
      - "dick"
      - "cock"
      - "pussy"
      - "cunt"
      - "whore"
      - "slut"
      - "crap"
      - "piss"
      - "damn"
      - "کص"
      - "کس"
      - "کیر"
      - "کون"
      - "کونده"
      - "جنده"
      - "فاحشه"
      - "حرومزاده"
      - "مادرجنده"
      - "بی شرف"
      - "بی‌شرف"
      - "بی ناموس"
      - "بی‌ناموس"
      - "گه"
      - "گوه"
      - "عن"
      - "لاشی"
      - "عوضی"
      - "الدنگ"
      - "پفیوز"
  advertisement:
    enabled: true
    block-ip: true
    block-domains: true
    server-names:
      - "MadCraft"
      - "TrexMine"
      - "GameUP"
      - "GunMax"
      - "EternullMC"
      - "NoxelSMP"
      - "BighanoonAbad"
      - "XCraft"
      - "MythoriaSMP"
      - "BitCraft"
      - "ColdGames"
      - "LunaMC"
      - "InfernoGaming"
      - "UCraft"
      - "PeakCraft"
      - "LexoGame"
      - "IceCreamSky"
      - "NeoCraft"
      - "PolluxMC"
      - "UKGame"
      - "EmoCrafts"
      - "MineHub"
      - "MineHeaven"
      - "AtlasCraft"
      - "LightMc"
      - "GameLandMC"
      - "SkyDenMc"
      - "ModernShadow"
      - "AetherMC"
      - "NullMC"
      - "BinerCraft"
  words:
    enabled: true
    blocked: []
alerts:
  enabled: true
  broadcast-network: true
  types:
    spam: true
    flood: true
    caps: true
    swear: true
    advertisement: true
    blocked-words: true
  format: "&c&l[ALERT]&r &c{type}&r &8| &7{server}&r &8| &f{player}&r &8| &7{message}"
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"
ignore:
  public-chat:
    enabled: false
spy:
  enabled: true
  autoenable: true
  # {type} remains available for custom formats. It is intentionally omitted from the defaults.
  private-message-format: "&8[&7SPY&r&8] &7{player}&r &8---> &7{target}&r &8: &7{message}"
  command-format: "&8[&7SPY&r&8] &7{player}&r &8: &7{message}"
storage:
  type: yaml
