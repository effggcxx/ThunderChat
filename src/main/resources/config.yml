# ThunderChat configuration

format:
  # Normal gamemode chat never leaves the current backend server.
  normal: "{prefix}{player}&7: &f{message}"
  # Global channels are network-wide and include the gamemode/server name.
  global: "&7[{server}] {prefix}{player}&7: &f{message}"
  # Add a PlaceholderAPI placeholder here later, e.g. "%luckperms_prefix% ".
  prefix-placeholder: ""

network:
  enabled: true
  # Set this differently on every backend server: skymine, bedwars, survival, etc.
  server-name: "skymine"

channels:
  default: local
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff

private-messages:
  enabled: true
  log-to-console: false

filter:
  enabled: true
  spam:
    max-repeated-messages: 3
    cooldown-seconds: 2
  caps:
    max-percentage: 70
    min-length-to-check: 8
  words:
    enabled: true
    blocked: []

mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"

storage:
  type: yaml
