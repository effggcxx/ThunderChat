# ThunderChat configuration

format:
  default: "&7[{channel}] {prefix}{player}&7: &f{message}"
  use-hex-gradients: true

channels:
  default: global
  list:
    global:
      radius: -1          # -1 = server-wide
    local:
      radius: 100
    staff:
      permission: thunderchat.channel.staff

private-messages:
  enabled: true
  log-to-console: false

filter:
  enabled: true
  spam:
    max-repeated-messages: 3
    cooldown-seconds: 2
  caps:
    max-percentage: 70
    min-length-to-check: 8
  words:
    enabled: true
    blocked: []

mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"

storage:
  type: yaml   # yaml | sqlite (future)
