# ThunderChat configuration
#
# Chat prefixes:
#   prefix-placeholder accepts any PlaceholderAPI placeholder.
#   Example for LuckPerms: "%luckperms_prefix% "
#   You can combine placeholders and normal text, for example:
#   "&8[&b%luckperms_prefix%&8] "
#   The resolved value is available in chat formats through {prefix}.
format:
  normal: "{prefix}&r{player}&7: &f{message}"
  global: "&7[{channel}] [{server}] {prefix}&r{player}&7: &f{message}"
  prefix-placeholder: "%luckperms_prefix% "
network:
  enabled: true
  server-name: "skymine"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  flood:
    enabled: true
    # A message is considered flood when the same character appears this many times consecutively.
    max-consecutive-characters: 3
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
    enabled: true
    words:
      - "fuck"
      - "fucking"
      - "fucked"
      - "motherfucker"
      - "shit"
      - "bullshit"
      - "bitch"
      - "asshole"
      - "bastard"
      - "dick"
      - "cock"
      - "pussy"
      - "cunt"
      - "whore"
      - "slut"
      - "crap"
      - "piss"
      - "damn"
      - "کص"
      - "کس"
      - "کیر"
      - "کون"
      - "کونده"
      - "جنده"
      - "فاحشه"
      - "حرومزاده"
      - "مادرجنده"
      - "بی شرف"
      - "بی‌شرف"
      - "بی ناموس"
      - "بی‌ناموس"
      - "گه"
      - "گوه"
      - "عن"
      - "لاشی"
      - "عوضی"
      - "الدنگ"
      - "پفیوز"
  advertisement:
    enabled: true
    # Blocks numeric IPv4 addresses such as 123.45.67.89:25565.
    block-ip: true
    # Blocks domain names such as example.com or play.example.net.
    block-domains: true
    # Add/remove known server names here. Matching is case-insensitive.
    server-names:
      - "MadCraft"
      - "TrexMine"
      - "GameUP"
      - "GunMax"
      - "EternullMC"
      - "NoxelSMP"
      - "BighanoonAbad"
      - "XCraft"
      - "MythoriaSMP"
      - "BitCraft"
      - "ColdGames"
      - "LunaMC"
      - "InfernoGaming"
      - "UCraft"
      - "PeakCraft"
      - "LexoGame"
      - "IceCreamSky"
      - "NeoCraft"
      - "PolluxMC"
      - "UKGame"
      - "EmoCrafts"
      - "MineHub"
      - "MineHeaven"
      - "AtlasCraft"
      - "LightMc"
      - "GameLandMC"
      - "SkyDenMc"
      - "ModernShadow"
      - "AetherMC"
      - "NullMC"
      - "BinerCraft"
  words:
    enabled: true
    blocked: []
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"
storage:
  type: yaml
