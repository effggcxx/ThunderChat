# ThunderChat configuration
#
# Chat prefixes:
#   prefix-placeholder accepts any PlaceholderAPI placeholder.
#   Example for LuckPerms: "%luckperms_prefix% "
#   You can combine placeholders and normal text, for example:
#   "&8[&b%luckperms_prefix%&8] "
#   The resolved value is available in chat formats through {prefix}.
format:
  normal: "{prefix}&r{player}&7: &f{message}"
  global: "&7[{channel}] [{server}] {prefix}&r{player}&7: &f{message}"
  prefix-placeholder: "%luckperms_prefix% "
network:
  enabled: true
  server-name: "skymine"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
    enabled: true
    # Add or remove words freely. Matching is case-insensitive.
    # English words use word boundaries; Persian/non-Latin words also match inside compounds.
    words:
      - "fuck"
      - "fucking"
      - "fucked"
      - "motherfucker"
      - "shit"
      - "bullshit"
      - "bitch"
      - "asshole"
      - "bastard"
      - "dick"
      - "cock"
      - "pussy"
      - "cunt"
      - "whore"
      - "slut"
      - "crap"
      - "piss"
      - "damn"
      - "کص"
      - "کس"
      - "کیر"
      - "کون"
      - "کونده"
      - "جنده"
      - "فاحشه"
      - "حرومزاده"
      - "مادرجنده"
      - "بی شرف"
      - "بی‌شرف"
      - "بی ناموس"
      - "بی‌ناموس"
      - "گه"
      - "گوه"
      - "عن"
      - "لاشی"
      - "عوضی"
      - "الدنگ"
      - "پفیوز"
  words:
    enabled: true
    blocked: []
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"
storage:
  type: yaml
