# ThunderChat configuration
#
# Every channel has its own format under format.channels.<channel>.
# Built-in placeholders available in every format:
#   {channel}  - channel display name
#   {server}   - backend server name from network.server-name
#   {prefix}   - resolved value of format.prefix-placeholder
#   {player}   - sender name
#   {message}  - chat message
#
# Any PlaceholderAPI placeholder can also be used directly in a channel format.
# Example: %luckperms_prefix%, %player_ping%, %world_name%, etc.
# PlaceholderAPI must provide the requested expansion.
format:
  prefix-placeholder: "%luckperms_prefix% "
  # Kept for backwards compatibility; channel-specific values below take priority.
  normal: "{prefix}&r{player}&7: &f{message}"
  global: "&7[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
  channels:
    local: "{prefix}&r{player}&7: &f{message}"
    global: "&7[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    staff: "&c[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    donator: "&6[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    admin: "&4[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
    highrank: "&b[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
network:
  enabled: true
  server-name: "skymine"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  flood:
    enabled: true
    max-consecutive-characters: 3
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
