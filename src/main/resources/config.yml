# ThunderChat configuration
# Channel formats support {channel}, {server}, {prefix}, {player}, {message}
# plus any PlaceholderAPI placeholder.
format:
  prefix-placeholder: "%luckperms_prefix% "
  normal: "{prefix}&r{player}&7: &f{message}"
  global: "&7[{channel}]&r &7[{server}]&r {prefix}&r{player}&r&7: &f{message}"
  channels:
    local: "{prefix}&r{player}&7: &f{message}"
    global: "<bold><c:dark_blue>GLOBAL<bold><c:aqua>Chat <bold><c:dark_gray>• &f{message}"
    staff: "<bold><c:dark_purple>Staff<bold><c:light_purple>Chat <bold><c:dark_gray>• &f{message}"
    donator: "<bold><c:dark_green>Donator<bold><c:green>Chat <bold><c:dark_gray>• &f{message}"
    admin: "<bold><c:dark_red>Admin<bold><c:red>Chat <bold><c:dark_gray>• &f{message}"
    highrank: "<bold><c:gold>HighRank<bold><c:yellow>Chat <bold><c:dark_gray>• &f{message}"
network:
  enabled: true
  server-name: "skymine"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  private-messages:
    enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  flood:
    enabled: true
    max-consecutive-characters: 3
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
    enabled: true
    words:
      - "fuck"
      - "fucking"
      - "fucked"
      - "motherfucker"
      - "shit"
      - "bullshit"
      - "bitch"
      - "asshole"
      - "bastard"
      - "dick"
      - "cock"
      - "pussy"
      - "cunt"
      - "whore"
      - "slut"
      - "crap"
      - "piss"
      - "damn"
      - "کص"
      - "کس"
      - "کیر"
      - "کون"
      - "کونده"
      - "جنده"
      - "فاحشه"
      - "حرومزاده"
      - "مادرجنده"
      - "بی شرف"
      - "بی‌شرف"
      - "بی ناموس"
      - "بی‌ناموس"
      - "گه"
      - "گوه"
      - "عن"
      - "لاشی"
      - "عوضی"
      - "الدنگ"
      - "پفیوز"
  advertisement:
    enabled: true
    block-ip: true
    block-domains: true
    server-names:
      - "MadCraft"
      - "TrexMine"
      - "GameUP"
      - "GunMax"
      - "EternullMC"
      - "NoxelSMP"
      - "BighanoonAbad"
      - "XCraft"
      - "MythoriaSMP"
      - "BitCraft"
      - "ColdGames"
      - "LunaMC"
      - "InfernoGaming"
      - "UCraft"
      - "PeakCraft"
      - "LexoGame"
      - "IceCreamSky"
      - "NeoCraft"
      - "PolluxMC"
      - "UKGame"
      - "EmoCrafts"
      - "MineHub"
      - "MineHeaven"
      - "AtlasCraft"
      - "LightMc"
      - "GameLandMC"
      - "SkyDenMc"
      - "ModernShadow"
      - "AetherMC"
      - "NullMC"
alerts:
  enabled: true
  broadcast-network: true
  types:
    spam: true
    flood: true
    caps: true
    swear: true
    advertisement: true
  format: "&c&l[ALERT]&r &c{type}&r &8| &7{server}&r &8| &f{player}&r &8| &7{message}"
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"
ignore:
  public-chat:
    enabled: false
spy:
  enabled: true
  autoenable: true
  # {type} remains available for custom formats. It is intentionally omitted from the defaults.
  private-message-format: "&8[&7SPY&r&8] &7{player}&r &8---> &7{target}&r &8: &7{message}"
  command-format: "&8[&7SPY&r&8] &7{player}&r &8: &7{message}"
  anvil-format: "&8[&7SPY&r&8] &7{player}&r &8renamed an item to: &f{message}"
  sign-format: "&8[&7SPY&r&8] &7{player}&r &8wrote on a sign: &f{message}"
  book-format: "&8[&7SPY&r&8] &7{player}&r &8wrote in a book: &f{message}"
storage:
  type: yaml
# Online player lists for staff / highrank / admin / donator channels
# Placeholders supported in format: %luckperms_prefix% (or %luckpermsprefix%),
# %player%, %server_name% (or %server name% / %server%), plus any PlaceholderAPI placeholders.
lists:
  staff:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no staff &donline&7."
  highrank:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no highrank &donline&7."
  admin:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no admin &donline&7."
  donator:
    header: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    format: "%luckperms_prefix%%player% &7(&d%server_name%&7) "
    footer: "&8&m------&5&m------&d&m------&5&m------&8&m------&f"
    nobody: " &7There is no donator &donline&7."