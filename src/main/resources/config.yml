# ThunderChat configuration
format:
  normal: "{prefix}{player}&7: &f{message}"
  global: "&7[{channel}] [{server}] {prefix}{player}&7: &f{message}"
  prefix-placeholder: ""
network:
  enabled: true
  server-name: "skymine"
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  spam:
    max-repeated-messages: 3
    cooldown-seconds: 2
  caps:
    max-percentage: 70
    min-length-to-check: 8
  words:
    enabled: true
    blocked: []
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "&e"
storage:
  type: yaml
