# ThunderChat configuration
# Channel formats support {channel}, {server}, {prefix}, {player}, {message}
# plus any PlaceholderAPI placeholder. All player-facing formats use MiniMessage.
format:
  prefix-placeholder: "%luckperms_prefix% "
  normal: "{prefix}<reset>{player}<gray>: <white>{message}"
  global: "<gray>[<reset>{channel}<gray>]</gray> <gray>[<reset>{server}<gray>]</gray> {prefix}<reset>{player}<gray>: <white>{message}"
  channels:
    local: "{prefix}<reset>{player}<gray>: <white>{message}"
    global: "<bold><dark_blue>GLOBAL</dark_blue> <aqua>Chat</aqua> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    staff: "<bold><dark_purple>Staff</dark_purple> <light_purple>Chat</light_purple> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    donator: "<bold><dark_green>Donator</dark_green> <green>Chat</green> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    admin: "<bold><dark_red>Admin</dark_red> <red>Chat</red> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    highrank: "<bold><gold>HighRank</gold> <yellow>Chat</yellow> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
network:
  enabled: true
  server-name: "skymine"
  servers:
    - "skymine"
    - "bedwars"
  queue-retention-minutes: 1440
channels:
  default: local
  global:
    permission: thunderchat.channel.global
  donator:
    permission: thunderchat.channel.donator
  staff:
    permission: thunderchat.channel.staff
  admin:
    permission: thunderchat.channel.admin
  highrank:
    permission: thunderchat.channel.highrank
private-messages:
  enabled: true
  log-to-console: false
filter:
  enabled: true
  private-messages:
    enabled: true
  spam:
    score-threshold: 5
    max-repeated-messages: 3
    cooldown-seconds: 2
  flood:
    enabled: true
    max-consecutive-characters: 3
  caps:
    enabled: true
    max-percentage: 70
    min-length-to-check: 8
  swear:
    enabled: true
    words:
      - "fuck"
      - "fucking"
      - "fucked"
      - "motherfucker"
      - "shit"
      - "bullshit"
      - "bitch"
      - "asshole"
      - "bastard"
      - "dick"
      - "cock"
      - "pussy"
      - "cunt"
      - "whore"
      - "slut"
      - "crap"
      - "piss"
      - "damn"
      - "کص"
      - "کس"
      - "کیر"
      - "کون"
      - "کونده"
      - "جنده"
      - "فاحشه"
      - "حرومزاده"
      - "مادرجنده"
      - "بی شرف"
      - "بی‌شرف"
      - "بی ناموس"
      - "بی‌ناموس"
      - "گه"
      - "گوه"
      - "عن"
      - "لاشی"
      - "عوضی"
      - "الدنگ"
      - "پفیوز"
  advertisement:
    enabled: true
    block-ip: true
    block-domains: true
    server-names:
      - "MadCraft"
      - "TrexMine"
      - "GameUP"
      - "GunMax"
      - "EternullMC"
      - "NoxelSMP"
      - "BighanoonAbad"
      - "XCraft"
      - "MythoriaSMP"
      - "BitCraft"
      - "ColdGames"
      - "LunaMC"
      - "InfernoGaming"
      - "UCraft"
      - "PeakCraft"
      - "LexoGame"
      - "IceCreamSky"
      - "NeoCraft"
      - "PolluxMC"
      - "UKGame"
      - "EmoCrafts"
      - "MineHub"
      - "MineHeaven"
      - "AtlasCraft"
      - "LightMc"
      - "GameLandMC"
      - "SkyDenMc"
      - "ModernShadow"
      - "AetherMC"
      - "NullMC"
alerts:
  enabled: true
  broadcast-network: true
  types:
    spam: true
    flood: true
    caps: true
    swear: true
    advertisement: true
  format: "<shadow:#000000><bold><red>[ALERT]</red> <red>{type}</red> <dark_gray>|</dark_gray> <gray>{server}</gray> <dark_gray>|</dark_gray> <white>{player}</white> <dark_gray>|</dark_gray> <gray>{message}</gray></bold></shadow>"
mentions:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  highlight-color: "<yellow>"
ignore:
  public-chat:
    enabled: false
spy:
  enabled: true
  autoenable: true
  private-message-format: "<shadow:#000000><bold><dark_gray>[SPY]</dark_gray></bold> <gray>{player}</gray> <dark_gray>---></dark_gray> <gray>{target}</gray> <dark_gray>:</dark_gray> <gray>{message}</gray></shadow>"
  command-format: "<shadow:#000000><bold><dark_gray>[SPY]</dark_gray></bold> <gray>{player}</gray> <dark_gray>:</dark_gray> <gray>{message}</gray></shadow>"
  anvil-format: "<shadow:#000000><bold><dark_gray>[SPY]</dark_gray></bold> <gray>{player}</gray> <dark_gray>renamed an item to:</dark_gray> <gray>{message}</gray></shadow>"
  sign-format: "<shadow:#000000><bold><dark_gray>[SPY]</dark_gray></bold> <gray>{player}</gray> <dark_gray>wrote on a sign:</dark_gray> <gray>{message}</gray></shadow>"
  book-format: "<shadow:#000000><bold><dark_gray>[SPY]</dark_gray></bold> <gray>{player}</gray> <dark_gray>wrote in a book:</dark_gray> <gray>{message}</gray></shadow>"
storage:
  type: mysql
  fallback: yaml
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "thunderchat"
    username: "root"
    password: "change-me"
    pool-size: 4
lists:
  staff:
    header: "<dark_gray><strikethrough>------</strikethrough></dark_gray><dark_purple><strikethrough>------</strikethrough></dark_purple><light_purple><strikethrough>------</strikethrough></light_purple><dark_purple><strikethrough>------</strikethrough></dark_purple><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    format: "{prefix}{player} <gray>({server})</gray>"
    footer: "<dark_gray><strikethrough>------</strikethrough></dark_gray><dark_purple><strikethrough>------</strikethrough></dark_purple><light_purple><strikethrough>------</strikethrough></light_purple><dark_purple><strikethrough>------</strikethrough></dark_purple><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    nobody: "<gray>There is no staff <light_purple>online</light_purple>.</gray>"
  highrank:
    header: "<dark_gray><strikethrough>------</strikethrough></dark_gray><gold><strikethrough>------</strikethrough></gold><yellow><strikethrough>------</strikethrough></yellow><gold><strikethrough>------</strikethrough></gold><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    format: "{prefix}{player} <gray>({server})</gray>"
    footer: "<dark_gray><strikethrough>------</strikethrough></dark_gray><gold><strikethrough>------</strikethrough></gold><yellow><strikethrough>------</strikethrough></yellow><gold><strikethrough>------</strikethrough></gold><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    nobody: "<gray>There is no highrank <yellow>online</yellow>.</gray>"
  admin:
    header: "<dark_gray><strikethrough>------</strikethrough></dark_gray><dark_red><strikethrough>------</strikethrough></dark_red><red><strikethrough>------</strikethrough></red><dark_red><strikethrough>------</strikethrough></dark_red><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    format: "{prefix}{player} <gray>({server})</gray>"
    footer: "<dark_gray><strikethrough>------</strikethrough></dark_gray><dark_red><strikethrough>------</strikethrough></dark_red><red><strikethrough>------</strikethrough></red><dark_red><strikethrough>------</strikethrough></dark_red><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    nobody: "<gray>There is no admin <red>online</red>.</gray>"
  donator:
    header: "<dark_gray><strikethrough>------</strikethrough></dark_gray><dark_green><strikethrough>------</strikethrough></dark_green><green><strikethrough>------</strikethrough></green><dark_green><strikethrough>------</strikethrough></dark_green><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    format: "{prefix}{player} <gray>({server})</gray>"
    footer: "<dark_gray><strikethrough>------</strikethrough></dark_gray><dark_green><strikethrough>------</strikethrough></dark_green><green><strikethrough>------</strikethrough></green><dark_green><strikethrough>------</strikethrough></dark_green><dark_gray><strikethrough>------</strikethrough></dark_gray>"
    nobody: "<gray>There is no donator <green>online</green>.</gray>"
interactive:
  enabled: true
  max-placeholders: 12
  universal-cooldown: 0
  item:
    enabled: true
    click-enabled: true
    cooldown: 0
  inventory:
    enabled: true
    cooldown: 0
  ender:
    enabled: true
    cooldown: 0
  player:
    enabled: true
    case-sensitive: true
    hover-enabled: true
    click-enabled: true
  commands:
    enabled: true
    format: "<aqua>[<yellow>{command}</yellow>]</aqua>"
    hover: "<yellow>Click to suggest <white>{command}</white>.</yellow>"
  position:
    enabled: true
  ping:
    enabled: true
  custom-placeholders:
    server:
      keyword: "(?i)\\[server\\]"
      replace: "<aqua>%server_name%</aqua>"
      cooldown: 0
    world:
      keyword: "(?i)\\[world\\]"
      replace: "<green>%player_world%</green>"
      cooldown: 0
    time:
      keyword: "(?i)\\[time\\]"
      replace: "<yellow>%server_time_HH:mm:ss%</yellow>"
      cooldown: 0
    pos:
      keyword: "(?i)\\[position\\]"
      replace: "<aqua>%player_world%</aqua> <white>%player_x%</white>, <white>%player_y%</white>, <white>%player_z%</white>"
      cooldown: 0
