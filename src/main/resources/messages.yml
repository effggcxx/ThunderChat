# ThunderChat messages
# Every entry in this file is player-facing and can be customized.
# MiniMessage is supported throughout this file.
# Placeholders use {name} syntax. Unknown placeholders remain unchanged.
# Behavior belongs in config.yml; player-facing text and display formats belong here.

prefix: "<gold><bold>ThunderChat</bold></gold> <dark_gray>»</dark_gray>"
errors:
  player-only: "<red>Only players can use this command.</red>"
  no-permission: "<red>You don't have permission to use this command.</red>"
  no-channel-permission: "<red>You don't have permission to use that chat channel.</red>"
  unknown-channel: "<red>Unknown channel.</red>"
  unknown-channel-detailed: "<red>Unknown chat channel. Use local, global, staff, donator, admin, or highrank.</red>"
  invalid-usage: "<red>Usage: {usage}</red>"
  player-unknown: "<red>That player is not known on this server.</red>"
pm:
  no-permission: "<red>You don't have permission to do that.</red>"
  disabled: "<red>Private messages are currently disabled.</red>"
  usage: "<red>Usage: /{label} <player> <message></red>"
  reply-usage: "<red>Usage: /{label} <message></red>"
  target-offline: "<red>Player '{player}' is not online.</red>"
  self: "<red>You can't message yourself.</red>"
  no-reply: "<red>No one to reply to.</red>"
  target-left: "<red>{player} is no longer online.</red>"
channel:
  current: "<gray>Current channel: <yellow>{channel}</yellow>"
  available: "<gray>Available channels:</gray>"
  entry: "<gray> - <yellow>{channel}</yellow>{hidden}"
  hidden-suffix: " <dark_gray>(hidden)</dark_gray>"
  changed: "<green>Chat channel set to <yellow>{channel}</yellow><green>.</green>"
  toggled: "<green>Chat channel: <yellow>{channel}</yellow><green>.</green>"
chat:
  usage: "<red>Usage: /chat <clear|mute|unmute> [channel] [player]</red>"
  mute-usage: "<red>Usage: /chat {action} [channel] [player]</red>"
  muted-global: "<green>{channel} CHAT {state} globally.</green>"
  muted-player: "<green>{player} has been {state} in {channel} CHAT.</green>"
  mute-state-muted: "muted"
  mute-state-unmuted: "unmuted"
  management-no-permission: "<red>You don't have permission to manage chat mutes.</red>"
admin:
  title: "<gold><bold>ThunderChat</bold></gold>"
  info-version: "<gray>Version: <white>{version}</white>"
  info-status: "<gray>Channels: <white>{channels}</white> <gray>| Filters: <white>{filters}</white>"
  info-reload: "<gray>Use <white>/thunderchat reload</white> <gray>to reload configuration."
  reload-success: "<green>Configuration and persistent mute data reloaded.</green>"
  usage: "<red>Usage: /thunderchat <reload|info|help> [page]</red>"
  filters-enabled: "enabled"
  filters-disabled: "disabled"
spy:
  no-permission: "<red>You don't have permission to spy.</red>"
  usage: "<red>Usage: /spy <on|off|status|toggle> [commands|private-messages|anvils|signs|books]</red>"
  toggle-usage: "<red>Usage: /spy toggle <commands|private-messages|anvils|signs|books></red>"
  enabled-all: "<green>Spy enabled for all available sections.</green>"
  disabled: "<yellow>Spy disabled.</yellow>"
  status: "<gray>Spy status: <white>{status}</white>"
  unknown-section: "<red>Unknown spy section.</red>"
  section-no-permission: "<red>You don't have permission to spy on that input type.</red>"
  toggled: "<green>Spy {section} is now {state}.</green>"
help:
  title: "<gold><bold>ThunderChat Help</bold></gold> <dark_gray>({page}/{max_page})</dark_gray>"
  max-page: 3
  page-1:
    - "<yellow>/chat <gray>- Manage your active/local chat and channel administration."
    - "<yellow>/channel <gray>- Switch to a channel you have access to."
    - "<yellow>/gc <gray>- Toggle global chat."
    - "<yellow>/sc <gray>- Toggle staff chat."
    - "<yellow>/dc <gray>- Toggle donator chat."
    - "<yellow>/ac <gray>- Toggle admin chat."
    - "<yellow>/hc <gray>- Toggle high-rank chat."
    - "<yellow>/chathide <gray>- Hide channels from your chat view."
  page-2:
    - "<yellow>/msg <player> <message> <gray>- Send a private message."
    - "<yellow>/reply <message> <gray>- Reply to your last private message."
    - "<yellow>/ignore <player> <gray>- Ignore a player."
    - "<yellow>/chatcolor <gray>- Open the chat color and formatting menu."
    - "<yellow>/spy <gray>- Toggle the local spy sections you are permitted to use."
    - "<yellow>/clearchat <channel> <gray>- Clear a channel's visible chat."
  page-3:
    - "<yellow>/channelmutelist <gray>- View channel mutes."
    - "<yellow>/stafflist <gray>- List visible staff members."
    - "<yellow>/donatorlist <gray>- List visible donators."
    - "<yellow>/adminlist <gray>- List visible admins."
    - "<yellow>/highranklist <gray>- List visible high-rank members."
    - "<gray>Use <white>/thunderchat help <page></white> to browse pages."
formats:
  alert: "<red><bold>[ALERT]</bold></red> <red>{type}</red> <dark_gray>|</dark_gray> <gray>{server}</gray> <dark_gray>|</dark_gray> <white>{player}</white> <dark_gray>|</dark_gray> <gray>{message}</gray>"
  mention-highlight: "<yellow>"
  spy:
    private-message: "<dark_gray>[<gray>SPY</gray>] <gray>{player}</gray> <dark_gray>---> <gray>{target}</gray> <dark_gray>: <gray>{message}</gray>"
    command: "<dark_gray>[<gray>SPY</gray>] <gray>{player}</gray> <dark_gray>: <gray>{message}</gray>"
    anvil: "<dark_gray>[<gray>SPY</gray>] <gray>{player}</gray> <dark_gray>renamed an item to: <white>{message}</white>"
    sign: "<dark_gray>[<gray>SPY</gray>] <gray>{player}</gray> <dark_gray>wrote on a sign: <white>{message}</white>"
    book: "<dark_gray>[<gray>SPY</gray>] <gray>{player}</gray> <dark_gray>wrote in a book: <white>{message}</white>"
  lists:
    staff:
      header: "<dark_gray>------<dark_purple>------<light_purple>------<dark_purple>------<dark_gray>------</dark_gray>"
      format: "{prefix}{player} <gray>({server})</gray>"
      footer: "<dark_gray>------<dark_purple>------<light_purple>------<dark_purple>------<dark_gray>------</dark_gray>"
      nobody: "<gray>There is no staff <light_purple>online</light_purple>.</gray>"
    highrank:
      header: "<dark_gray>------<gold>------<yellow>------<gold>------<dark_gray>------</dark_gray>"
      format: "{prefix}{player} <gray>({server})</gray>"
      footer: "<dark_gray>------<gold>------<yellow>------<gold>------<dark_gray>------</dark_gray>"
      nobody: "<gray>There is no high-rank <yellow>online</yellow>.</gray>"
    admin:
      header: "<dark_gray>------<dark_red>------<red>------<dark_red>------<dark_gray>------</dark_gray>"
      format: "{prefix}{player} <gray>({server})</gray>"
      footer: "<dark_gray>------<dark_red>------<red>------<dark_red>------<dark_gray>------</dark_gray>"
      nobody: "<gray>There is no admin <red>online</red>.</gray>"
    donator:
      header: "<dark_gray>------<dark_green>------<green>------<dark_green>------<dark_gray>------</dark_gray>"
      format: "{prefix}{player} <gray>({server})</gray>"
      footer: "<dark_gray>------<dark_green>------<green>------<dark_green>------<dark_gray>------</dark_gray>"
      nobody: "<gray>There is no donator <green>online</green>.</gray>"
  channels:
    local: "{prefix}<reset>{player}<gray>: <white>{message}"
    global: "<bold><dark_blue>GLOBAL</dark_blue> <aqua>Chat</aqua> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    staff: "<bold><dark_purple>Staff</dark_purple> <light_purple>Chat</light_purple> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    donator: "<bold><dark_green>Donator</dark_green> <green>Chat</green> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    admin: "<bold><dark_red>Admin</dark_red> <red>Chat</red> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
    highrank: "<bold><gold>HighRank</gold> <yellow>Chat</yellow> <dark_gray>•</dark_gray></bold> <white>{message}</white>"
