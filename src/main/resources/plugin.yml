name: ThunderChat
version: '${version}'
main: me.ehsan.thunderchat.ThunderChat
api-version: '1.21'
author: Ehsan
softdepend: [LuckPerms, PlaceholderAPI]

commands:
  msg:
    description: Send a private message to a player
    usage: /msg <player> <message>
    aliases: [tell, w, whisper]
  reply:
    description: Reply to the last player who messaged you
    usage: /reply <message>
    aliases: [r]
  ignore:
    description: Toggle ignoring a player's messages
    usage: /ignore <player>
  unignore:
    description: Stop ignoring a player's messages
    usage: /unignore <player>
  channel:
    description: Switch between available chat channels
    usage: /channel <local|global|staff|donator|admin|highrank>
    aliases: [ch]
  clearchat:
    description: Clear local or global chat
    usage: /clearchat [local|global|staff|donator|admin|highrank]
    aliases: [cc]
  chathide:
    description: Toggle visibility of chat channels for yourself
    usage: /chathide [local|global|staff|donator|admin|highrank|all]
  staffchat:
    description: Toggle staff chat
    aliases: [sc]
  donatorchat:
    description: Toggle donator chat
    aliases: [dc]
  adminchat:
    description: Toggle admin chat
    aliases: [ac]
  highrankchat:
    description: Toggle high-rank chat
    aliases: [hc]
  gc:
    description: Toggle global chat
  chat:
    description: Manage chat, defaulting to local chat
    usage: /chat <clear|mute|unmute> [channel] [player]
  channelmutelist:
    description: List globally muted channels and muted players per channel
    usage: /channelmutelist [page]
    aliases: [cml, mutelist]
  spy:
    description: Monitor commands and private messages locally
    usage: /spy <on|off|status|toggle> [commands|private-messages]
  chatcolor:
    description: Open the Chat Color menu
    usage: /chatcolor
    aliases: [ccolor]
  thunderchat:
    description: Reload config / admin subcommands
    usage: /thunderchat <reload>
    aliases: [tc]

permissions:
  thunderchat.admin:
    description: Access to admin/reload commands
    default: op
  thunderchat.chatcolor:
    description: Allows using the Chat Color GUI and applying chat colors
    default: false
  thunderchat.chatcolor.custom.*:
    description: Allows every custom Chat Color formatting option
    default: false
    children:
      thunderchat.chatcolor.custom: true
  thunderchat.chatcolor.custom:
    description: Allows using custom MiniMessage chat formatting
    default: false
  thunderchat.msg:
    description: Allows sending private messages
    default: true
  thunderchat.ignore:
    description: Allows using the ignore system
    default: true
  thunderchat.command.spy:
    description: Allows using the /spy command
    default: op
  thunderchat.spy.autoenable:
    description: Automatically enable both local spy sections on first join
    default: op
  thunderchat.bypass.spy:
    description: Prevents this player's commands and private messages from being spied on
    default: false
  thunderchat.clearchat.*:
    description: Allows clearing every ThunderChat channel
    default: op
    children:
      thunderchat.clearchat.local: true
      thunderchat.clearchat.global: true
      thunderchat.clearchat.staff: true
      thunderchat.clearchat.donator: true
      thunderchat.clearchat.admin: true
      thunderchat.clearchat.highrank: true
  thunderchat.clearchat.local:
    description: Allows clearing local gamemode chat
    default: op
  thunderchat.clearchat.global:
    description: Allows clearing global chat
    default: op
  thunderchat.clearchat.staff:
    description: Allows clearing staff chat
    default: op
  thunderchat.clearchat.donator:
    description: Allows clearing donator chat
    default: op
  thunderchat.clearchat.admin:
    description: Allows clearing admin chat
    default: op
  thunderchat.clearchat.highrank:
    description: Allows clearing high-rank chat
    default: op
  thunderchat.bypass.clearchat.*:
    description: Keeps previous chat visible for every clear-chat channel
    default: op
    children:
      thunderchat.bypass.clearchat.local: true
      thunderchat.bypass.clearchat.global: true
      thunderchat.bypass.clearchat.staff: true
      thunderchat.bypass.clearchat.donator: true
      thunderchat.bypass.clearchat.admin: true
      thunderchat.bypass.clearchat.highrank: true
  thunderchat.bypass.clearchat.local:
    description: Bypass local gamemode chat clears
    default: op
  thunderchat.bypass.clearchat.global:
    description: Bypass global chat clears
    default: op
  thunderchat.bypass.clearchat.staff:
    description: Bypass staff chat clears
    default: op
  thunderchat.bypass.clearchat.donator:
    description: Bypass donator chat clears
    default: op
  thunderchat.bypass.clearchat.admin:
    description: Bypass admin chat clears
    default: op
  thunderchat.bypass.clearchat.highrank:
    description: Bypass high-rank chat clears
    default: op
  thunderchat.channel.global:
    description: Access to global chat
    default: op
  thunderchat.channel.staff:
    description: Access to the network-wide staff channel
    default: op
  thunderchat.channel.donator:
    description: Access to the network-wide donator channel
    default: false
  thunderchat.channel.admin:
    description: Access to the network-wide admin channel
    default: op
  thunderchat.channel.highrank:
    description: Access to the network-wide high-rank channel
    default: false
  thunderchat.bypass.mute:
    description: Bypass all ThunderChat mutes
    default: op
  thunderchat.bypass.mute.global:
    description: Bypass global chat mutes
    default: op
  thunderchat.bypass.mute.local:
    description: Bypass local gamemode chat mutes
    default: op
  thunderchat.bypass.mute.staff:
    description: Bypass staff chat mutes
    default: op
  thunderchat.bypass.mute.donator:
    description: Bypass donator chat mutes
    default: op
  thunderchat.bypass.mute.admin:
    description: Bypass admin chat mutes
    default: op
  thunderchat.bypass.mute.highrank:
    description: Bypass high-rank chat mutes
    default: op
  thunderchat.bypass.filter:
    description: Bypass spam/caps/flood/blocked-word/advertisement filters
    default: op
  thunderchat.bypass.spam:
    description: Bypass spam filter only
    default: op
  thunderchat.bypass.flood:
    description: Bypass anti-flood filter
    default: op
  thunderchat.bypass.caps:
    description: Bypass anti-caps normalization
    default: op
  thunderchat.bypass.swear:
    description: Bypass the swear-word filter
    default: op
  thunderchat.bypass.advertisement:
    description: Bypass the anti-advertisement filter
    default: op
  thunderchat.alert.*:
    description: Receive every ThunderChat filter alert
    default: op
    children:
      thunderchat.alert.spam: true
      thunderchat.alert.flood: true
      thunderchat.alert.caps: true
      thunderchat.alert.swear: true
      thunderchat.alert.advertisement: true
      thunderchat.alert.blocked-words: true
  thunderchat.alert.spam:
    description: Receive spam detection alerts
    default: op
  thunderchat.alert.flood:
    description: Receive flood detection alerts
    default: op
  thunderchat.alert.caps:
    description: Receive caps detection alerts
    default: op
  thunderchat.alert.swear:
    description: Receive swear-word detection alerts
    default: op
  thunderchat.alert.advertisement:
    description: Receive advertisement detection alerts
    default: op
  thunderchat.alert.blocked-words:
    description: Receive blocked-word detection alerts
    default: op
  thunderchat.channelmutelist:
    description: View the list of globally muted channels and muted players
    default: op
  thunderchat.mention:
    description: Allows triggering @mentions
    default: true
  thunderchat.chathide.*:
    description: Allows hiding every available chat channel for yourself
    default: op
    children:
      thunderchat.chathide.local: true
      thunderchat.chathide.global: true
      thunderchat.chathide.staff: true
      thunderchat.chathide.donator: true
      thunderchat.chathide.admin: true
      thunderchat.chathide.highrank: true
      thunderchat.chathide.all: true
  thunderchat.chathide.local:
    description: Allows hiding local gamemode chat for yourself
    default: true
  thunderchat.chathide.global:
    description: Allows hiding global chat for yourself
    default: true
  thunderchat.chathide.staff:
    description: Allows hiding staff chat for yourself
    default: true
  thunderchat.chathide.donator:
    description: Allows hiding donator chat for yourself
    default: true
  thunderchat.chathide.admin:
    description: Allows hiding admin chat for yourself
    default: true
  thunderchat.chathide.highrank:
    description: Allows hiding high-rank chat for yourself
    default: true
  thunderchat.chathide.all:
    description: Allows hiding all available chat channels for yourself
    default: true
